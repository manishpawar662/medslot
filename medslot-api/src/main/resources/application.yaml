app:
  jwt:
    secret: ${JWT_SECRET:bWVkc2xvdC1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy0yMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

spring:
  application:
    name: medslot-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medslot}
    username: ${DB_USERNAME:medslot_user}
    password: ${DB_PASSWORD:medslot_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}